name: Test

on:
  push:
  pull_request:
  schedule:
    - cron: '20 7 * * 6'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
# Scheduled and manual runs use a separate group so they never cancel
# or replace push or pull request runs, queued or running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-weekly' || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
